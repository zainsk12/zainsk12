<svg width="880" height="220" viewBox="0 0 880 220"
     xmlns="http://www.w3.org/2000/svg" font-family="'SF Pro Display','Inter','Segoe UI',Helvetica,Arial,sans-serif">
  <style>
    text { user-select: none; }
    .mono { font-family: 'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace; }
    
    .footer-bg { fill: #0A0A0B; }
    .prompt { font-family: 'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace; font-size: 11.5px; fill: #6E6E73; }
    .output { font-family: 'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace; font-size: 11.5px; fill: #A1A1A6; }
    .cta { font-size: 24px; font-weight: 700; fill: #F5F5F7; letter-spacing: -0.3px; }
    .cta-sub { font-size: 13px; fill: #A1A1A6; }
    .closing-note { font-size: 10px; fill: #6E6E73; }
    
    #footer-prompt {
      animation: fadeRise-footer-prompt 450ms cubic-bezier(.16,1,.3,1) 80ms both;
    }
    @keyframes fadeRise-footer-prompt {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    #footer-output {
      animation: fadeRise-footer-output 450ms cubic-bezier(.16,1,.3,1) 260ms both;
    }
    @keyframes fadeRise-footer-output {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    #footer-cta {
      animation: fadeRise-footer-cta 550ms cubic-bezier(.16,1,.3,1) 420ms both;
    }
    @keyframes fadeRise-footer-cta {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    #footer-sub {
      animation: fadeRise-footer-sub 550ms cubic-bezier(.16,1,.3,1) 560ms both;
    }
    @keyframes fadeRise-footer-sub {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    #footer-chips {
      animation: fadeRise-footer-chips 550ms cubic-bezier(.16,1,.3,1) 720ms both;
    }
    @keyframes fadeRise-footer-chips {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    #footer-note {
      animation: fadeRise-footer-note 450ms cubic-bezier(.16,1,.3,1) 880ms both;
    }
    @keyframes fadeRise-footer-note {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    #footer-cursor {
      animation: blink-footer-cursor 480ms steps(1) 2880ms 6;
      opacity: 1;
    }
    @keyframes blink-footer-cursor { 50% { opacity: 0; } }
    
  </style>

