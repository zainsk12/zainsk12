<svg width="280" height="300" viewBox="0 0 280 300"
     xmlns="http://www.w3.org/2000/svg" font-family="'SF Pro Display','Inter','Segoe UI',Helvetica,Arial,sans-serif">
  <style>
    text { user-select: none; }
    .mono { font-family: 'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace; }
    
    .p-bg { fill: #0A0A0B; }
    .p-name { font-size: 17px; font-weight: 700; fill: #F5F5F7; text-anchor: middle; }
    .p-role { font-size: 11.5px; fill: #A1A1A6; text-anchor: middle; }
    .p-mono { font-size: 46px; font-weight: 700; fill: #F5F5F7; text-anchor: middle;
               letter-spacing: 2px; }
    
    #portrait-core {
      animation: fadeRise-portrait-core 550ms cubic-bezier(.16,1,.3,1) 150ms both;
    }
    @keyframes fadeRise-portrait-core {
      from { opacity: 0; transform: translateY(0px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    #portrait-name {
      animation: fadeRise-portrait-name 450ms cubic-bezier(.16,1,.3,1) 650ms both;
    }
    @keyframes fadeRise-portrait-name {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    #portrait-role {
      animation: fadeRise-portrait-role 450ms cubic-bezier(.16,1,.3,1) 750ms both;
    }
    @keyframes fadeRise-portrait-role {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    #portrait-outer-ring {
      stroke-dasharray: 563;
      animation: draw-portrait-outer-ring 1100ms ease-out 200ms both;
    }
    @keyframes draw-portrait-outer-ring {
      from { stroke-dashoffset: 563; }
      to { stroke-dashoffset: 0; }
    }
    
    #portrait-mid-ring {
      stroke-dasharray: 452;
      animation: draw-portrait-mid-ring 900ms ease-out 350ms both;
    }
    @keyframes draw-portrait-mid-ring {
      from { stroke-dashoffset: 452; }
      to { stroke-dashoffset: 0; }
    }
    
  </style>

<rect class="p-bg" x="0" y="0" width="280" height="300" rx="20"/>
<rect x="0.5" y="0.5" width="279" height="299" rx="20" fill="none" stroke="#232326"/>
<defs>
      <radialGradient id="portraitGlow" cx="50%" cy="42%" r="55%">
        <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.14"/>
        <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0"/>
      </radialGradient>
    </defs>
<circle cx="140" cy="130" r="112" fill="url(#portraitGlow)"/>
<polygon id="portrait-outer-ring" points="140.0,38.0 205.1,64.9 232.0,130.0 205.1,195.1 140.0,222.0 74.9,195.1 48.0,130.0 74.9,64.9" fill="none" stroke="#5EEAD4" stroke-width="1.4" stroke-opacity="0.5" stroke-linejoin="round"/>
<circle id="portrait-mid-ring" cx="140" cy="130" r="72" fill="none" stroke="#6E6E73" stroke-width="1" stroke-opacity="0.4"/>

    <g id="portrait-core">
      <circle cx="140" cy="130" r="54" fill="#111113" stroke="#5EEAD4" stroke-width="1.5"/>
      <text x="140" y="146" class="p-mono">SZ</text>
    </g>

    <circle id="orbit-1" cx="215.1" cy="67.0" r="4" fill="#5EEAD4">
      <animateTransform attributeName="transform" type="rotate"
        from="0 140 130" to="360 140 130"
        begin="400ms" dur="6000ms"
        repeatCount="1" fill="freeze"/>
    </circle>

    <circle id="orbit-2" cx="77.2" cy="182.7" r="3" fill="#5EEAD4">
      <animateTransform attributeName="transform" type="rotate"
        from="0 140 130" to="360 140 130"
        begin="550ms" dur="5000ms"
        repeatCount="1" fill="freeze"/>
    </circle>

    <circle id="orbit-3" cx="63.8" cy="86.0" r="2.5" fill="#5EEAD4">
      <animateTransform attributeName="transform" type="rotate"
        from="0 140 130" to="360 140 130"
        begin="700ms" dur="7000ms"
        repeatCount="1" fill="freeze"/>
    </circle>
<text id="portrait-name" x="140" y="254" class="p-name">Shaikh Md. Zain</text>
<text id="portrait-role" x="140" y="274" class="p-role">Full-Stack Developer</text>
</svg>